# RED settings — the reference defaults.
#
# This is RED's settings documentation: every key, with its default and a one-line
# note. Copy what you want into your own settings.toml (open it from the command
# palette — ⌘K → "settings: open file"). Edits there apply live, no restart.
#
# The file degrades per section: a single bad value defaults just its own section
# and shows a banner — it never resets the whole file. A missing file is fine; RED
# launches on these defaults.
#
# Sections are cut by what a setting is *about*, not by which engine it came from:
#
#   app     [appearance] [editor] [keymap] [behavior] [update]
#   data    [data]    — every grid: SQL results, Redis keys, MongoDB documents
#   safety  [safety]  — every write path, every engine
#   seam    [sql] [kv] [doc] — named for the driver seam, not for one engine
#   agent   [ai]
#
# Renamed in 0.20: [grid] → [data], [redis] → [kv], and [query] split into [sql]
# (execution) + [safety] (the cross-engine guards). Older files are migrated on
# load and re-saved in the new shape, so nothing needs changing by hand.
#
# Location:
#   macOS    ~/Library/Application Support/red/settings.toml
#   Linux    ~/.config/red/settings.toml          (XDG)
#   Windows  %APPDATA%\red\settings.toml

[appearance]
# The color theme. Either a single name…
theme = "One Dark"
#   …or a mode-aware pair that follows the OS (or forces light / dark):
# theme = { mode = "system", light = "Ayu Light", dark = "One Dark" }
#   mode = "system" | "light" | "dark"
# Built-in themes: "One Dark", "GitHub Dark", "Ayu Light". Drop your own theme
# files into <config>/red/themes/*.toml (or import them from the settings panel):
#
#   name = "My Theme"
#   appearance = "dark"      # "dark" | "light"
#   base = "One Dark"        # built-in to inherit unset tokens from (optional)
#   accent = "#ff8800"       # override any token by name, as #RRGGBB
#   bg_app = "#101013"
#
# The accent is whatever the theme defines — there is no separate accent override.

# Interface fonts: a sans family for chrome and a mono family for in-UI data
# (result grid cells, schema identifiers). Both share `ui_font_size` (px, clamped
# to 8–32); the whole UI scales from it. Match the two families for a uniform look.
# Also settable from the Appearance panel. The editor has its own [editor] font.
ui_font_family = "IBM Plex Sans"
ui_mono_family = "IBM Plex Mono"
ui_font_size = 13

# Suppress non-essential animation (currently the indeterminate progress sweep),
# for motion sensitivity. RED has no OS "reduce motion" bridge yet, so this is the
# manual opt-in.
reduce_motion = false

# The interface language. "system" follows the OS; otherwise a locale code that
# ships a catalog in `assets/i18n/`. English is the only translation so far, so
# every value currently resolves to it. An unrecognised code falls back to English
# rather than failing the load.
#   locale = "system" | "en"
# "en-XA" is a pseudolocale (English with accented letters, every string bracketed)
# used to audit which strings are still hardcoded. Not a language.
locale = "system"

[editor]
# Code-editor typography, shared by the SQL editor, the JSON editor, and the Redis
# console. A monospace family is recommended. `line_height` is a multiple of the
# font size (clamped to 1.0–3.0).
font_family = "IBM Plex Mono"
font_size = 13
line_height = 1.5
tab_width = 2

[keymap]
# Layer vim-style motions (hjkl, g/G, Ctrl-d/Ctrl-u) onto the result grid and the
# history dock, alongside the existing arrow keys. Applies live, no restart.
# Per-key rebinds live in keymap.toml, not here.
vim_mode = false

[data]
# Data-view defaults, shared by EVERY grid: the SQL result grid, the Redis key
# list, and the MongoDB document grid. A few knobs only one seam can honour; those
# say so below (and are badged in the settings panel).

# Row spacing: "compact" | "comfortable" | "spacious". All grids.
density = "comfortable"

# Rows pulled per page as you scroll — the keyset/offset fetch window. Larger
# pages mean fewer round-trips but more resident rows. Clamped to 20–5000.
# Honored by the SQL result cursor, the MongoDB keyset window, and (as the soft
# target per SCAN round trip) the Redis key list.
page_size = 200

# Hard cap on the characters of any one cell kept resident — the fat-cell memory
# rail. The driver reads over-cap blobs by length only and clips long text to a
# prefix, so a page of huge cells can't spike RAM. Export stays full-fidelity.
# Clamped to 256–1048576. SQL grid + MongoDB document cells.
max_cell_chars = 4096

# What a SQL NULL renders as in a cell (e.g. "∅", "NULL", or "" for blank).
# SQL results only.
null_display = "NULL"

# Show the leading row-number gutter. SQL results only.
row_numbers = true

# Result size past which the column-stats bar withholds count(distinct) until you
# ask for it, so selecting a column never silently starts a full scan. SQL only.
stats_distinct_max_rows = 1000000

# Ceiling on rows a select-all / whole-column copy pulls into the clipboard; a
# larger copy is clipped to this with a warning. Clamped to 1000–1000000.
copy_row_limit = 100000

[safety]
# The guards between you and losing data. Cross-engine: one scale grades a SQL
# statement, a Redis key delete, and a MongoDB document delete.

# How dangerous an action has to be before RED asks first:
#   "write"    — anything that writes at all, including a filtered UPDATE/DELETE
#                and plain DDL. The most cautious, and noisy by design.
#   "risky"    — anything that reaches further than it names: an unfiltered
#                UPDATE/DELETE, a privilege change, a DROP, a Redis key delete,
#                a MongoDB document delete. The default.
#   "critical" — only what destroys a whole object (DROP TABLE, TRUNCATE).
#   "never"    — nothing is confirmed.
# A connection marked env = "prod" confirms from "risky" whatever this says, types
# those confirmations out rather than clicking them, and offers no "don't ask
# again"; env = "local" never asks below "critical".
confirm_from = "risky"

# Confirm before closing a tab that holds unsaved work.
confirm_close_tab = true

# Add an advisory AI second opinion to a confirmation RED already stopped, for the
# mistakes a keyword check can't see. Off by default and off is the honest
# default: enabling it sends the statement and a schema summary to the configured
# provider. It is never a gate — the verdict is displayed and nothing more.
ai_review = false

[sql]
# The SQL seam: knobs that only mean something for a SQL engine.

# Append LIMIT n to a bare `SELECT *` so a fat table can't flood the grid. 0
# disables it. Queries that write their own LIMIT are left untouched.
auto_limit = 1000

# Abort a query — and each of its page/run fetches — that runs longer than this
# many seconds, at the engine. 0 disables the cap.
statement_timeout = 0

# Watch mode re-runs a result's query on an interval and flashes what changed.
# This is the interval a newly-opened result arms itself at; 0 (the default)
# means watch starts only when you ask for it, per tab. Setting it above 0 makes
# every result you open a repeating query until you turn its watch off.
watch_default_secs = 0

# Floor under any watch interval, in seconds. A watch is a query on a loop, so
# this is a load guard rather than a preference; a connection tagged `prod` is
# floored at 10s regardless of what you put here.
watch_min_secs = 2

[kv]
# The key-value seam: the Redis key browser today, and any future KvDriver engine
# unchanged, which is why it's named for the seam and not for Redis.

# How a new browse tab's filter box reads what you type:
#   "glob"   — a raw SCAN … MATCH pattern (user:*). The default.
#   "prefix" — a literal prefix; glob metacharacters match literally.
#   "exact"  — one exact key name, resolved directly (no SCAN).
#   "fuzzy"  — client-side fuzzy match over loaded keys.
#   "value"  — substring search over string values; runs on Enter.
# Changeable per tab from the filter dropdown.
default_query_mode = "glob"

# Seconds between automatic key re-scans in a NEW browse tab; 0 is off. Change it
# for an already-open tab from the browser's actions menu. A non-zero value is
# floored at 1s so a stray tiny setting can't spin the scanner.
auto_refresh_secs = 0

# Soft cap on the keys one browse tab keeps resident. The list is append-only with
# evict-oldest beyond this, so a long unfiltered browse can't grow without bound.
# Clamped to 1000–500000.
max_resident_keys = 20000

# Elements of a collection value (list, stream) the inspector pulls per fetch.
# Clamped to 10–5000.
preview_count = 200

[doc]
# The document seam: the MongoDB browser today, and any future DocDriver engine.
# Page size and the cell cap are NOT here — those are [data], shared with every
# other grid.

# How a newly-opened collection renders: "table" | "list" | "json". Changeable per
# tab from the collection toolbar.
default_view = "table"

# Top-level fields the sampled-column table shows. A wider document is still whole
# in List, JSON, and the inspector. Clamped to 2–64.
max_columns = 12

[behavior]
# Reconnect to the most recently used connection on launch (credentials come from
# the OS keychain). Off shows the connection picker.
restore_last_session = false

# How often the Server panel re-samples live metrics and the session list, in
# seconds; 0 is off and is the default. Polling pg_stat_activity or CLIENT LIST
# against a production server is real load, so this is opt-in, floored at 2, and
# the live interval is shown in the panel itself. Changeable per connection from
# the panel's own control.
server_refresh_secs = 0

[update]
# Poll GitHub Releases for newer signed builds in the background and stage them
# for a one-click restart. false is a true off switch: no timer, no network.
auto_update = true

# Hours between background checks (the first runs at launch). Floored at 1 so a
# hand-edited 0 can't turn the updater into a tight network loop.
check_interval_hours = 6

[ai]
# The master switch for the grounded chat agent (⌘L). false is a true kill
# switch — no panel entry point, no local MCP server, no agent process. A
# connection can override it in connections.toml (ai_enabled).
enabled = true

# Which backend handles turns:
#   "anthropic"    — the Claude Messages API, billed to an API key (keychain/env).
#   "subscription" — Claude Code over ACP, billed to a Pro/Max subscription.
# Legacy: superseded by [[ai.agents]] below once you define any.
provider = "anthropic"

# How much the agent's tools can see (the capability boundary):
#   "off"    — no database tools; the agent chats without DB grounding.
#   "schema" — structure only (tables, columns, types) — never row data.
#   "read"   — the full read catalog: capped SELECTs + EXPLAIN. A tool above the
#              tier is never offered to the model.
#   "write"  — adds the gated propose_write tool (a single INSERT/UPDATE/DELETE that
#              needs your explicit per-statement approval, is blocked on read-only
#              connections, and never runs DDL or an unqualified UPDATE/DELETE).
# A connection can override this in connections.toml (ai_tier) — e.g. keep the
# global default at "read" and grant "write" only on a specific trusted connection,
# or flip it on per writable connection via the connection form's "Allow writes".
tier = "read"

# Model id for the API-key path. Empty falls back to the Opus default. The
# subscription agent picks its own model.
model = "claude-opus-4-8"

# Surface a summarized "thinking…" affordance while the model reasons.
show_thinking = false

# Before you approve a write the agent proposes, count the rows it would change
# and show a few of them in the prompt. "Allow this?" over an UPDATE whose WHERE
# clause you cannot evaluate is a question nobody can answer, so the realistic
# outcome is a rubber stamp. Turn this off on a slow link, where the extra
# round-trips before every prompt cost more than the number is worth.
preview_writes = true

# How long the agent's uncommitted changes wait for your Commit or Roll back
# before rolling back on their own, in seconds. Only used by chats you put in
# review-transaction mode (the "review" switch in the composer). An open
# transaction holds locks, so it cannot wait indefinitely; rolling back is the
# only defensible expiry, since RED never commits an agent's writes unasked.
# Floored at 30s.
sandbox_timeout_secs = 120

# Folder the agent writes generated HTML reports to. Empty uses the system temp
# dir; set it so reports land somewhere you can find them.
report_dir = ""

# Advanced: override the subscription agent's launch command. Empty uses the
# default (npx -y @agentclientprotocol/claude-agent-acp).
agent_command = ""

# Multiple agents. Define named profiles and pick which a new chat starts on with
# the selector in the panel (and manage them in Settings → AI). When NO [[ai.agents]]
# are defined, two are synthesized from the keys above ("anthropic" API + "subscription"
# ACP) so this section is optional. Each profile's API key lives in the OS keyring
# under `ai-key:<id>`, never here. `kind` is "api" (Messages API via red-ai, optional
# base_url) or "acp" (an external agent over ACP — Claude Code, codex, a local agent).
#
# default_agent = "claude-sub"
#
# [[ai.agents]]
# id = "claude-sub"
# name = "Claude (subscription)"
# kind = "acp"
# command = ""              # empty = default Claude Code invocation
#
# [[ai.agents]]
# id = "codex"
# name = "Codex"
# kind = "acp"
# command = "codex acp"
#
# [[ai.agents]]
# id = "claude-api"
# name = "Claude (API)"
# kind = "api"
# wire = "anthropic"
# model = "claude-opus-4-8"
#
# [[ai.agents]]
# id = "local"
# name = "Local"
# kind = "api"
# wire = "anthropic"        # an Anthropic-wire-compatible endpoint
# base_url = "http://127.0.0.1:8080"
# model = "..."

[ai.limits]
# Defense-in-depth caps the read-tier tools run under. Each can be disabled with 0
# (where noted), but the defaults are sane ceilings. You can raise these well above
# the defaults (or disable them) at your own risk: the Settings UI flags such values
# in red, since they let the agent pull large result sets and run up token cost.

# Hard row ceiling on one tool SELECT; a larger LIMIT is clamped down to this.
max_rows = 1000

# Per-tool-call statement timeout in milliseconds. 0 disables it.
statement_timeout_ms = 15000

# Trim a tool result larger than this (bytes) before it reaches the model. 0 off.
max_result_bytes = 262144

# Cumulative tool-call budget per conversation, bounding a runaway loop. 0 off.
max_tool_calls = 100

# Ceiling on the tokens one model reply may generate. A reply that hits the
# ceiling is continued automatically (up to three times) rather than failing, but
# a long answer or a generated report is cheaper to get in a single pass. Current
# Claude models allow up to 128000 here; the default is roomy rather than maximal
# because output tokens are the expensive ones.
max_output_tokens = 16384
